<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>BhojPatra Desk</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #0f172a; }
      main { width: min(28rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2.5rem; border-radius: 1.5rem; background: white; box-shadow: 0 2rem 5rem rgb(0 0 0 / 35%); text-align: center; }
      strong { display: inline-block; padding: .35rem .8rem; border-radius: .65rem; background: #f4511e; color: white; font-size: 1.35rem; }
      h1 { margin: 1.25rem 0 .75rem; font-size: 1.5rem; }
      p { margin: 0; color: #475569; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <strong>BhojPatra</strong>
      <h1>Web access has been retired</h1>
      <p>Restaurant operations are available only through the installed BhojPatra Desk application. Contact your administrator for the Windows installer.</p>
    </main>
  </body>
</html>
